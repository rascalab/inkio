name: Publish Packages

on:
  push:
    tags:
      - 'v[0-9]*'

# Serialize releases per tag: a stray re-push must queue behind the
# in-flight publish, never run alongside it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm skips versions already on npm, so a tag whose manifests were never
      # bumped would pass every step and publish nothing. Stop it up front.
      - name: Require package versions to match the tag
        run: node scripts/release-version.mjs check "$GITHUB_REF_NAME"

      # The full suite (typecheck, tests, e2e on both browsers, docs) already
      # ran on this exact commit when it reached main; publishing re-checks only
      # what it ships. Waits if the tag was pushed before that CI run finished.
      - name: Require a main commit that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          run_id=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No CI run for $GITHUB_SHA"
            exit 1
          fi
          if ! gh run watch "$run_id" --exit-status --interval 30 > /dev/null; then
            echo "::error::CI run $run_id for $GITHUB_SHA did not succeed"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Package gates (publint, attw, budgets)
        run: pnpm package:gates

      - name: Release smoke
        run: pnpm release:smoke
        env:
          INKIO_RELEASE_SMOKE_SKIP_PACKAGE_BUILDS: '1'

      - name: Publish core and extensions
        run: pnpm publish:packages
