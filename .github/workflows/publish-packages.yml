name: Publish Packages

on:
  push:
    tags:
      - 'v[0-9]*'

# Serialize releases per tag: a stray re-push must queue behind the
# in-flight publish, never run alongside it.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Test
        run: pnpm test
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build workspace
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Build examples
        run: pnpm examples:build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: E2E smoke (chromium)
        run: pnpm e2e
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: E2E smoke (firefox)
        run: pnpm exec playwright test --project=firefox
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Package gates (publint, attw, budgets)
        run: pnpm package:gates
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Release smoke
        run: pnpm release:smoke
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Publish core and extensions
        run: pnpm publish:packages
