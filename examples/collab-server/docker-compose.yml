name: inkio-collab-split

services:
  api:
    image: node:22-alpine
    user: node
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
    command: ["node", "examples/collab-server/dist/api-main.js"]
    environment:
      PORT: "3100"
      COLLAB_HOST: "0.0.0.0"
      COLLAB_ROOM_ID: ${COLLAB_ROOM_ID:?Set the one allowed room ID}
      COLLAB_EDITOR_TOKEN: ${COLLAB_EDITOR_TOKEN:?Set an explicit random editor token}
      COLLAB_VIEWER_TOKEN: ${COLLAB_VIEWER_TOKEN:?Set an explicit random viewer token}
      COLLAB_VERIFY_KEY: ${COLLAB_VERIFY_KEY:?Set a distinct internal service key}
    restart: unless-stopped

  sync:
    image: node:22-alpine
    user: node
    working_dir: /repo
    volumes:
      - ../..:/repo:ro
      - ./data:/data
    command: ["node", "examples/collab-server/dist/sync-main.js"]
    environment:
      PORT: "3123"
      COLLAB_HOST: "0.0.0.0"
      DATA_DIR: /data
      COLLAB_VERIFY_KEY: ${COLLAB_VERIFY_KEY:?Set a distinct internal service key}
      VERIFY_URL: http://api:3100/collab/verify
    ports:
      - "127.0.0.1:3123:3123"
    depends_on:
      - api
    restart: unless-stopped
