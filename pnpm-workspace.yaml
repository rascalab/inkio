packages:
  - 'packages/core'
  - 'packages/advanced'
  - 'packages/simple'
  - 'packages/editor'
  - 'packages/image-editor'
  - 'packages/collab'
  - 'docs'
  - 'examples/*'
overrides:
  '@asamuzakjp/css-color': ^4.1.2
  # Docs-only transitive deps (nextra chain) whose resolved versions npm flags:
  # speech-rule-engine pins @xmldom/xmldom 0.9.9 ("critical issues"),
  # @ungap/structured-clone 1.3.0 is CWE-502. Same-minor patch releases.
  '@xmldom/xmldom': ^0.9.12
  '@ungap/structured-clone': ^1.4.0
# sharp ships prebuilt binaries; its install script is not needed here.
# Declared so pnpm (11+) does not fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  sharp: false
autoInstallPeers: false
preferWorkspacePackages: true
linkWorkspacePackages: true
