packages:
  - 'packages/core'
  - 'packages/advanced'
  - 'packages/simple'
  - 'packages/editor'
  - 'packages/image-editor'
  - 'packages/collab'
  - 'docs'
  - 'examples/*'
overrides:
  '@asamuzakjp/css-color': ^4.1.2
  # Docs-only transitive deps (nextra chain) whose resolved versions npm flags:
  # speech-rule-engine pins @xmldom/xmldom 0.9.9 ("critical issues"),
  # @ungap/structured-clone 1.3.0 is CWE-502. Same-minor patch releases.
  '@xmldom/xmldom': ^0.9.12
  '@ungap/structured-clone': ^1.4.0
  # Nextra and Mermaid's transitive ranges still admit vulnerable releases.
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  'dompurify@<3.4.17': ^3.4.17
  'katex@<0.18.2': ^0.18.2
  'lodash-es@<=4.17.23': ^4.18.1
  'mermaid@>=11.0.0 <11.16.1': ^11.16.1
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  'uuid@>=11.0.0 <11.1.1': ^11.1.1
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  # Express is pinned by Nest's HTTP adapter; patch its vulnerable dependencies.
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'qs@>=6.7.0 <6.16.1': ^6.16.1
  # jsdom's fetch implementation is used only by the tests.
  'undici@>=8.0.0 <8.12.2': ^8.12.2
# sharp ships prebuilt binaries; its install script is not needed here.
# Declared so pnpm (11+) does not fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  sharp: false
autoInstallPeers: false
preferWorkspacePackages: true
linkWorkspacePackages: true
patchedDependencies:
  nextra-theme-docs@4.6.1: patches/nextra-theme-docs@4.6.1.patch
